<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Special Grade Rem: enlaces</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#f1effa;--card:#fff;--ink:#1a1433;--dim:#655e82;--line:#ddd8f0;--acc:#d9154f;--acc-ink:#fff;--acc2:#5b3df5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f26;--card:#1d1938;--ink:#f3f0ff;--dim:#a7a0c8;--line:#342e5a;--acc:#ff4f7b;--acc-ink:#1a0a12;--acc2:#9d8bff}}
:root[data-theme="dark"]{--bg:#120f26;--card:#1d1938;--ink:#f3f0ff;--dim:#a7a0c8;--line:#342e5a;--acc:#ff4f7b;--acc-ink:#1a0a12;--acc2:#9d8bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:40px 20px 56px;text-align:center}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px;border-radius:12px}
.av{width:104px;height:104px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(150deg,var(--acc),var(--acc2));display:grid;place-items:center;font:800 48px 'Bricolage Grotesque',sans-serif;color:#fff;overflow:hidden;border:3px solid var(--card);box-shadow:0 0 0 3px var(--acc2)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
h1{font:800 clamp(34px,9vw,46px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:0 0 6px}
.user{color:var(--acc2);font-weight:700;margin:0 0 10px}
.tag{color:var(--dim);margin:0 0 24px}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:16px;font-weight:700;font-size:18px;background:var(--acc);color:var(--acc-ink);margin-bottom:28px}
.btn:hover{filter:brightness(1.08)}
.list{display:grid;gap:12px;margin-bottom:32px}
.lk{display:flex;align-items:center;gap:14px;min-height:60px;padding:0 18px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;font-weight:700;text-align:left}
.lk:hover{border-color:var(--acc2)}
.lk span{font-size:22px}
.btn+.dc{margin-top:-16px}
.dc{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;margin-bottom:28px;border-radius:16px;background:#5865f2;color:#fff}.dc:hover{filter:brightness(1.08)}.dc .di{font-size:30px}.dc b{display:block}.dc small{display:block;opacity:.94;font-size:15px;line-height:1.35}
h2{font:800 22px 'Bricolage Grotesque',sans-serif;margin:0 0 12px;text-align:left}
.lk.soon{opacity:.75;cursor:default}.lk.soon em{margin-left:auto;font-style:normal;font-weight:400;font-size:15px;color:var(--dim)}
</style>
</head>
<body>
<main>
  <div class="av" id="ini" aria-hidden="true"></div>
  <h1 id="nombre"></h1>
  <p class="user" id="usuario"></p>
  <p class="tag" id="frase"></p>
  <a class="btn" id="sub" target="_blank" rel="noopener">Suscribirme</a>
  <a class="dc" id="dc" target="_blank" rel="noopener"></a>
  <div class="list" id="links"></div>
</main>
